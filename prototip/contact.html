<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · 3 variante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0908;--cream:#f6efe3;--muted:#a99d92;--gold:#ffb52e;--orange:#f26a21;--red:#e53222;--grad:linear-gradient(90deg,#ffb52e,#f26a21 45%,#e53222)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--cream);font-family:Inter,sans-serif;overflow-x:hidden}
  .serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
  .hand{font-family:Caveat,cursive;color:var(--gold)}
  .gtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .eb{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#ff8a3d}

  /* secțiunea, copiată din site */
  .contact{position:relative;padding:140px clamp(20px,6vw,90px) 120px;background:#0b0908;text-align:center;overflow:hidden}
  .contact::before{content:"";position:absolute;inset:-20% -10% auto;height:70%;background:radial-gradient(closest-side,rgba(242,106,33,.22),transparent 70%),radial-gradient(closest-side at 70% 40%,rgba(122,14,14,.35),transparent 70%);filter:blur(40px);pointer-events:none}
  .contact>*{position:relative}
  .contact h2{font-family:Unbounded;font-weight:800;font-size:clamp(34px,5.4vw,80px);letter-spacing:-.04em;line-height:1;margin-top:14px}
  .contact .intro{color:var(--muted);font-size:16px;max-width:520px;margin:18px auto 0;line-height:1.55}
  .cways{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px;max-width:860px;margin:56px auto 0;text-align:left}
  .cway{position:relative;display:block;padding:30px;border-radius:26px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--cream);text-decoration:none;backdrop-filter:blur(8px);transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s}
  a.cway:hover{transform:translateY(-6px);border-color:rgba(242,106,33,.6);background:rgba(242,106,33,.08)}
  .cway .ic{width:48px;height:48px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;margin-bottom:22px}
  .cway h3{font-family:Unbounded;font-weight:600;font-size:22px;letter-spacing:-.02em}
  .cway p{color:#cfc4ba;font-size:14px;margin-top:8px;line-height:1.5}
  .cway .h{display:inline-block;margin-top:18px;font-weight:600;font-size:15px;word-break:break-all}
  .cway .arr{position:absolute;top:30px;right:30px;font-size:22px;transition:transform .3s}
  a.cway:hover .arr{transform:translate(4px,-4px)}
  .contact .note2{margin-top:34px;font-size:26px;transform:rotate(-3deg);display:inline-block}

  /* formularul */
  .fcard{max-width:860px;margin:20px auto 0;text-align:left;padding:34px;border-radius:26px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px)}
  .fcard.accent{border-color:rgba(242,106,33,.45);background:linear-gradient(160deg,rgba(242,106,33,.10),rgba(255,255,255,.03) 55%)}
  .fcard h3{font-family:Unbounded;font-weight:600;font-size:22px;letter-spacing:-.02em}
  .fcard .sub{color:#cfc4ba;font-size:14px;margin-top:8px;line-height:1.5}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .fgrid .full{grid-column:1/-1}
  .fld label,.fld .lb{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--cream)}
  .fld .opt{color:var(--muted);font-weight:400}
  .fld input,.fld textarea{width:100%;font:inherit;font-size:16px;color:var(--cream);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;outline:none;transition:border-color .2s,background .2s}
  .fld textarea{min-height:110px;resize:vertical;line-height:1.5}
  .fld input::placeholder,.fld textarea::placeholder{color:#7d7269}
  .fld input:focus,.fld textarea:focus{border-color:var(--orange);background:rgba(242,106,33,.06)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:inherit;font-size:14px;font-weight:500;color:var(--cream);background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 16px;cursor:pointer;transition:all .2s}
  .chip:hover{border-color:rgba(242,106,33,.6)}
  .chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:22px;flex-wrap:wrap}
  .legal{font-size:12px;color:var(--muted);line-height:1.5;max-width:420px}
  .legal a{color:var(--cream)}
  .btn{font-family:Unbounded;font-weight:600;font-size:15px;color:#fff;background:var(--grad);border:0;border-radius:999px;padding:16px 28px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 30px -10px rgba(242,106,33,.7)}
  .btn:hover{transform:translateY(-2px)}
  .alt{font-size:13px;color:var(--muted);margin-top:16px}
  .alt a{color:var(--cream)}
  .ok{display:none;text-align:center;padding:30px 0 10px}
  .ok .big{font-family:Unbounded;font-weight:800;font-size:28px;letter-spacing:-.03em}
  .ok .hand{font-size:26px;display:inline-block;transform:rotate(-3deg);margin-top:10px}
  .fcard.sent form{display:none}
  .fcard.sent .ok{display:block}

  /* varianta B: două coloane */
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;max-width:960px;margin:56px auto 0;text-align:left;align-items:stretch}
  .split .fcard{margin:0;max-width:none}
  .split .fgrid{grid-template-columns:1fr}

  /* varianta C: cardul spre pagină + pagina */
  .pagina{min-height:100vh;padding:120px clamp(20px,6vw,90px) 100px;position:relative;overflow:hidden}
  .pagina::before{content:"";position:absolute;inset:-10% -20% auto auto;width:70%;height:60%;background:radial-gradient(closest-side,rgba(242,106,33,.25),transparent 70%);filter:blur(40px);pointer-events:none}
  .pagina>*{position:relative}
  .pagina .wrap{max-width:720px;margin:0 auto}
  .pagina .back{font-size:14px;color:var(--muted);text-decoration:none;cursor:pointer}
  .pagina h1{font-family:Unbounded;font-weight:800;font-size:clamp(34px,5vw,64px);letter-spacing:-.04em;line-height:1.02;margin-top:22px}
  .pagina .intro{color:var(--muted);font-size:16px;margin-top:16px;line-height:1.55;max-width:520px}
  .pagina .fcard{max-width:none;margin-top:36px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
  .step{border-top:1px solid rgba(255,255,255,.14);padding-top:12px;font-size:13px;color:#cfc4ba;line-height:1.45}
  .step b{display:block;font-family:Unbounded;font-weight:600;font-size:12px;color:var(--gold);margin-bottom:4px}

  /* bara de navigare falsă, ca pe site */
  .nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(20px,6vw,90px);background:rgba(11,9,8,.7);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
  .nav b{font-family:Unbounded;font-weight:800;letter-spacing:-.02em}
  .nav span{color:var(--muted)}
  .lbl{position:absolute;top:84px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6d625a;white-space:nowrap}

  /* comutatorul */
  .sw{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;gap:6px;align-items:center;padding:8px;border-radius:999px;background:rgba(20,16,14,.92);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);box-shadow:0 20px 40px -20px #000;font-size:13px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
  .sw button{font:inherit;color:var(--cream);background:transparent;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
  .sw button.on{background:var(--grad);color:#fff;font-weight:600}
  .sw .sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 4px}

  /* vederea de telefon */
  .tel{display:none;justify-content:center;gap:40px;padding:40px 20px 120px;flex-wrap:wrap}
  .tel figure{display:flex;flex-direction:column;align-items:center;gap:12px}
  .tel figcaption{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .tel iframe{width:390px;height:780px;border:10px solid #1d1916;border-radius:44px;background:var(--ink)}
  body.modtel .desk{display:none}
  body.modtel .tel{display:flex}
  body.embed .sw{display:none}

  @media (max-width:720px){
    .fgrid{grid-template-columns:1fr}
    .split{grid-template-columns:1fr}
    .fcard{padding:26px 22px}
    .cway{padding:26px 22px}
    .cway .arr{top:26px;right:22px}
    .frow{flex-direction:column;align-items:stretch}
    .btn{width:100%}
    .steps{grid-template-columns:1fr}
    .contact{padding:110px 20px 100px}
    .lbl{top:70px}
  }
</style>
</head>
<body>

<div class="desk" id="scena"></div>

<div class="tel" id="tel"></div>

<div class="sw" id="sw">
  <button data-v="a">A · sub carduri</button>
  <button data-v="b">B · în locul e-mailului</button>
  <button data-v="c">C · pagină separată</button>
  <span class="sep"></span>
  <button data-m="desk">Calculator</button>
  <button data-m="tel">Telefon 390px</button>
</div>

<template id="t-form">
  <form onsubmit="event.preventDefault();this.closest('.fcard').classList.add('sent')">
    <div class="fgrid">
      <div class="fld"><label>Numele tău</label><input placeholder="ex. Maria Popescu" autocomplete="name"></div>
      <div class="fld"><label>Telefon</label><input type="tel" placeholder="07xx xxx xxx" autocomplete="tel"></div>
      <div class="fld full"><span class="lb">Serviciu dorit</span>
        <div class="chips" role="group">
          <button type="button" class="chip" aria-pressed="false">Site</button>
          <button type="button" class="chip" aria-pressed="false">Automatizări</button>
          <button type="button" class="chip" aria-pressed="false">Ghid personalizat</button>
          <button type="button" class="chip" aria-pressed="false" data-altceva>Altceva</button>
        </div>
      </div>
      <div class="fld full"><label>Descriere <span class="opt">(opțional)</span></label><textarea placeholder="Ce firmă ai și ce ți-ar plăcea să rezolvi."></textarea></div>
    </div>
    <div class="frow">
      <p class="legal">Folosesc numele și telefonul doar ca să te contactez despre cererea ta. Detalii în <a href="#">politica de confidențialitate</a>.</p>
      <button class="btn" type="submit">Trimite</button>
    </div>
  </form>
  <div class="ok">
    <div class="big">Am primit. <span class="serif gtxt">Mersi!</span></div>
    <div class="hand">te contactez în 1–2 zile</div>
  </div>
</template>

<script>
const IG=`<a class="cway" href="#"><span class="arr">↗</span><div class="ic">IG</div><h3>Mesaj pe Instagram</h3><p>Cel mai rapid. Îmi scrii în privat și îți răspund acolo.</p><span class="h gtxt">@buildwithac.ai</span></a>`;
const MAIL=`<a class="cway" href="#"><span class="arr">↗</span><div class="ic">@</div><h3>E-mail</h3><p>Pentru firme, colaborări sau întrebări mai lungi.</p><span class="h gtxt">contact@buildwithac.ro</span></a>`;
const NAV=`<div class="nav"><b>buildwithac</b><span>Ghiduri · Portofoliu · Servicii · Contact</span></div>`;
const form=()=>document.getElementById('t-form').innerHTML;
const head=(intro)=>`<div class="eb">Contact</div><h2>Ai o întrebare? <span class="serif gtxt">Scrie-mi.</span></h2><p class="intro">${intro}</p>`;
const TITLURI=['Vrei să <span class="serif gtxt">colaborăm?</span>'];
let t=+(new URLSearchParams(location.search).get('t')||0);
const INTRO='Despre un ghid, o idee de clip sau AI-ul din firma ta. Răspund eu, nu un robot.';

const V={
  a:()=>`${NAV}<section class="contact"><span class="lbl">varianta A · formularul sub cele două carduri</span>${head(INTRO)}
    <div class="cways">${IG}${MAIL}</div>
    <div class="fcard accent"><h3>${TITLURI[t]}</h3><p class="sub">Lasă-mi numele și telefonul, iar eu revin în cel mai scurt timp posibil.</p>${form()}</div>
    <div class="note2 hand">răspund de obicei în 1–2 zile</div></section>`,
  b:()=>`${NAV}<section class="contact"><span class="lbl">varianta B · formularul în locul cardului de e-mail</span>${head(INTRO)}
    <div class="split">${IG}<div class="fcard accent"><h3>Vrei ceva pentru firma ta?</h3><p class="sub">Lasă-mi numele și telefonul. Te sun eu și vorbim 10 minute despre ce ai nevoie.</p>${form()}<p class="alt">Preferi e-mailul? Scrie la <a href="#">contact@buildwithac.ro</a></p></div></div>
    <div class="note2 hand">răspund de obicei în 1–2 zile</div></section>`,
  c:()=>`${NAV}<section class="contact"><span class="lbl">varianta C · un card trimite la pagina /contact</span>${head(INTRO)}
    <div class="cways" style="max-width:1100px">${IG}${MAIL}<a class="cway" href="#" style="border-color:rgba(242,106,33,.45);background:linear-gradient(160deg,rgba(242,106,33,.12),rgba(255,255,255,.03) 60%)" onclick="event.preventDefault();arata('c2')"><span class="arr">→</span><div class="ic">✦</div><h3>Cere o ofertă</h3><p>Site, automatizări sau un ghid făcut pentru firma ta. Completezi în 1 minut.</p><span class="h gtxt">deschide formularul</span></a></div>
    <div class="note2 hand">răspund de obicei în 1–2 zile</div></section>`,
  c2:()=>`${NAV}<section class="pagina"><div class="wrap"><a class="back" onclick="arata('c')">← înapoi la site</a>
    <div class="eb" style="margin-top:28px">Lucrăm împreună</div>
    <h1>Spune-mi ce ai <span class="serif gtxt">în minte.</span></h1>
    <p class="intro">Lasă-mi numele și telefonul. Te sun eu, vorbim 10 minute, apoi îți spun ce se poate face și cât costă.</p>
    <div class="steps"><div class="step"><b>1 · azi</b>Completezi formularul de mai jos.</div><div class="step"><b>2 · în 1–2 zile</b>Te sun și vorbim despre firma ta.</div><div class="step"><b>3 · după</b>Primești o ofertă clară, fără obligații.</div></div>
    <div class="fcard accent">${form()}</div>
    <p class="alt" style="margin-top:20px">Preferi altfel? <a href="#">Instagram</a> sau <a href="#">contact@buildwithac.ro</a></p></div></section>`
};

const q=new URLSearchParams(location.search);
const embed=q.has('embed');
if(embed)document.body.classList.add('embed');
let v=q.get('v')||'a', m='desk';

function lega(rad){
  rad.querySelectorAll('.chips').forEach(g=>g.addEventListener('click',e=>{
    const c=e.target.closest('.chip');if(!c)return;
    g.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));
    const ta=g.closest('form').querySelector('textarea');
    const lab=ta.previousElementSibling;
    if(c.hasAttribute('data-altceva')){ta.placeholder='Spune-mi ce ai în minte.';}
    else{ta.placeholder='Ce firmă ai și ce ți-ar plăcea să rezolvi.';}
  }));
}
function arata(nv){
  v=nv;
  const s=document.getElementById('scena');s.innerHTML=V[v]();lega(s);
  window.scrollTo(0,0);
  document.querySelectorAll('.sw [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v[0]));
  document.querySelectorAll('.sw [data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===t));
  if(m==='tel')tel();
}
function tel(){
  const vv=v[0];
  const t=document.getElementById('tel');
  const pag=vv==='c'?`<figure><iframe src="?embed&v=c2"></iframe><figcaption>C · pagina /contact</figcaption></figure>`:'';
  t.innerHTML=`<figure><iframe src="?embed&v=${vv}&t=${t}"></iframe><figcaption>${vv.toUpperCase()} · secțiunea Contact</figcaption></figure>${pag}`;
  t.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',()=>{const d=f.contentDocument;const sc=d.querySelector('.contact');if(sc)f.contentWindow.scrollTo(0,sc.offsetTop-20)}));
}
function mod(nm){
  m=nm;document.body.classList.toggle('modtel',m==='tel');
  document.querySelectorAll('.sw [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(m==='tel')tel();
}
document.getElementById('sw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v)arata(b.dataset.v);if(b.dataset.t){t=+b.dataset.t;arata(v)}if(b.dataset.m)mod(b.dataset.m)});
arata(v);mod('desk');
</script>
</body>
</html>
