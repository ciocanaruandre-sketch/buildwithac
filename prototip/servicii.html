<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicii · variante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0908;--cream:#f6efe3;--muted:#a99d92;--grad:linear-gradient(90deg,#ffb52e,#f26a21 45%,#e53222)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#050404;color:var(--cream);font-family:Inter,sans-serif;overflow-x:hidden}
  .serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
  .gtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .eb{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#ff8a3d}

  .frame{margin:0 auto;background:var(--ink);transition:max-width .3s}
  body.tel .frame{max-width:390px;border-left:1px solid #222;border-right:1px solid #222}

  /* secțiunea, copiată din site (components/home/home.css) */
  .serv{position:relative;padding:140px clamp(20px,6vw,90px) 260px;background:#0b0908;overflow:hidden}
  .serv::before{content:"";position:absolute;inset:-10% -10% auto;height:60%;background:radial-gradient(closest-side,rgba(242,106,33,.18),transparent 70%),radial-gradient(closest-side at 75% 40%,rgba(122,14,14,.3),transparent 70%);filter:blur(40px);pointer-events:none}
  .serv>*{position:relative}
  .serv h2{font-family:Unbounded;font-weight:800;font-size:clamp(30px,4.4vw,64px);letter-spacing:-.04em;line-height:1.05;margin-top:14px}
  .stack{margin-top:50px}
  .scard{position:sticky;top:110px;min-height:340px;border-radius:30px;padding:40px;margin-bottom:40px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
  .scard:nth-child(1){background:#1c1411}
  .scard:nth-child(2){background:#2a120c;top:130px}
  .scard:nth-child(3){background:#3d0f0a;top:150px}
  .scard .n{font-family:Unbounded;font-size:13px;color:#ff8a3d}
  .scard h3{font-family:Unbounded;font-weight:800;font-size:clamp(26px,3vw,42px);letter-spacing:-.03em;line-height:1.05;margin-top:10px}
  .scard h3 .serif{font-size:1.12em;letter-spacing:0}
  .scard .kick{display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(22px,2.4vw,32px);letter-spacing:0;margin-top:6px}
  .scard p{color:#cfc4ba;font-size:15px;line-height:1.55}
  .scard .soon{display:inline-block;margin-top:16px;font-size:11px;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:var(--muted)}
  @media (max-width:700px){.scard{grid-template-columns:1fr;padding:30px;min-height:280px}}
  body.tel .scard{grid-template-columns:1fr;padding:30px;min-height:280px}
  body.tel .serv{padding-left:20px;padding-right:20px}
  body.tel .serv h2{font-size:30px}
  body.tel .scard h3{font-size:26px}
  body.tel .scard .kick{font-size:22px}

  /* comutatorul */
  .sw{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;width:min(760px,calc(100% - 20px));background:rgba(20,16,14,.94);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 14px;backdrop-filter:blur(10px);font-size:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .sw .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}
  .sw .lab{width:112px;color:var(--muted);flex-shrink:0}
  .sw button{font:inherit;color:var(--cream);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;cursor:pointer}
  .sw button.on{background:var(--grad);border-color:transparent;color:#1a0d07;font-weight:600}
  .sw .cur{width:100%;color:#ffcf8a;font-size:11px;padding:2px 0 0 118px}
  @media (max-width:600px){.sw .lab{width:100%}.sw .cur{padding-left:0}}
</style>
</head>
<body>
<div class="frame">
  <section class="serv" id="servicii">
    <div class="eb">Servicii</div>
    <h2>Când vrei să-l <span class="serif gtxt">facem împreună.</span></h2>
    <div class="stack" id="stack"></div>
  </section>
</div>

<div class="sw" id="sw"></div>

<script>
const STIL = ["1", "2", "3", "4"];
const V = [
  { nume: "01 · Site", t: 'Site făcut <span class="serif gtxt">de la zero</span>', p: [
    'Ai o afacere bună, dar online nu se vede. Îți fac un site care arată cât de bine lucrezi și le spune clienților exact ce oferi.',
    'Știi că ai nevoie de un site, dar nu vrei unul care seamănă cu toate celelalte. Îl construiesc de la zero, pornind de la felul în care arată și lucrează afacerea ta.',
    'Clienții noi își fac o părere despre tine după ce văd online. Îți fac un site construit de la zero, care arată ca afacerea ta.',
    'Fiecare afacere are felul ei de a arăta. Îți fac site-ul de la zero, în jurul pozelor și culorilor tale, ca să te recunoască oricine l-a văzut o dată.',
  ]},
  { nume: "02 · Automatizări", t: 'Automatizări <span class="serif gtxt">pentru firma ta</span>', p: [
    'Pierzi ore pe săptămână cu aceleași mesaje și aceleași tabele. Le fac să meargă singure, iar timpul ăsta ți-l petreci cu clienții.',
    'Știi că o parte din munca ta se repetă zilnic, dar n-ai avut timp să schimbi asta. Găsim împreună ce se poate face automat, iar eu construiesc restul.',
    'Unele lucruri din firma ta se fac la fel în fiecare zi, de la confirmările trimise clienților până la comenzile trecute în tabel. Pe acestea le fac să meargă fără tine.',
    'Dacă o treabă se face la fel de fiecare dată, n-ar trebui s-o mai faci tu. O automatizez cu aplicațiile pe care le folosești deja.',
  ]},
  { nume: "03 · 1 la 1", t: 'Sesiune 1 la 1<span class="kick gtxt">sau ghid personalizat</span>', p: [
    'Îți arăt cum să folosești AI-ul în munca ta. Live, pe ecran, sau într-un ghid scris doar pentru tine.',
    'Lucrăm pe treburile tale de zi cu zi, de la mesajele către clienți până la oferte. Pleci cu ele făcute cu AI.',
    'Știi că AI-ul te-ar putea ajuta, dar nu știi de unde să începi. Pornim de la ce faci tu zilnic și îți arăt unde îți scurtează munca.',
    'Ne vedem online și îmi arăți ce faci zilnic. Îți arăt pas cu pas cum faci asta cu AI, iar dacă vrei, primești totul și scris.',
  ]},
];
const S = { ales: [0, 0, 2], tel: false };
const L = "ABCD";

function render() {
  document.getElementById("stack").innerHTML = V.map((c, i) =>
    `<div class="scard"><div><div class="n">0${i + 1}</div><h3>${c.t}</h3></div><div><p>${c.p[S.ales[i]]}</p><span class="soon">în curând</span></div></div>`).join("");
  document.getElementById("sw").innerHTML =
    V.map((c, i) => `<div class="row"><span class="lab">${c.nume}</span>${c.p.map((_, j) =>
      `<button class="${S.ales[i] === j ? "on" : ""}" data-c="${i}" data-o="${j}">${L[j]}</button>`).join("")}</div>`).join("") +
    `<div class="row"><span class="lab">Vizualizare</span><button class="${S.tel ? "" : "on"}" data-v="0">Desktop</button><button class="${S.tel ? "on" : ""}" data-v="1">Telefon 390px</button></div>`;
  document.body.classList.toggle("tel", S.tel);
}
document.getElementById("sw").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v !== undefined) S.tel = b.dataset.v === "1";
  else S.ales[+b.dataset.c] = +b.dataset.o;
  render();
});
render();
</script>
</body>
</html>
