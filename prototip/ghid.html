<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>buildwithac · prototip pagină de ghid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;800&family=Instrument+Serif:ital@0;1&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0908;--ink2:#15100d;--cream:#f6efe3;--muted:#a99d92;--gold:#ffb52e;--orange:#f26a21;--red:#e53222;--wine:#7a0e0e;
        --grad:linear-gradient(90deg,#ffb52e,#f26a21 45%,#e53222)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--ink);scroll-behavior:smooth}
  body{background:transparent;color:var(--cream);font-family:Inter,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  a{color:inherit}
  .gtxt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
  .hand{font-family:Caveat,cursive;color:var(--gold)}
  .eb{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#ff8a3d}
  .lbl{display:inline-block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;background:rgba(242,106,33,.15);color:#ff8a3d;padding:4px 10px;border-radius:999px;border:1px dashed rgba(242,106,33,.5)}

  /* aurora (fundalul ales) */
  .aur{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .aur .rib{position:absolute;left:-20%;width:140%;height:26%;border-radius:50%;filter:blur(60px);opacity:.22;mix-blend-mode:screen;animation:rib 18s ease-in-out infinite alternate}
  @keyframes rib{0%{transform:translateX(-8%) rotate(var(--r)) scaleY(.8)}100%{transform:translateX(8%) rotate(calc(var(--r) * -1)) scaleY(1.2)}}
  .aur .grain{position:absolute;inset:0;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  /* NAV */
  .nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,40px);transition:background .3s}
  .nav.solid{background:rgba(11,9,8,.75);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
  .nav .l{display:flex;align-items:center;gap:12px}
  .nav img{width:38px;height:38px;border-radius:50%;object-fit:cover}
  .nav .back{font-size:13px;font-weight:500;text-decoration:none;opacity:.85;background:rgba(11,9,8,.35);backdrop-filter:blur(12px);padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12)}
  .nav .soc{display:flex;gap:8px}
  .nav .soc a{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;text-decoration:none;background:rgba(11,9,8,.35);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12)}
  .prog{position:fixed;top:0;left:0;height:3px;width:100%;z-index:70;background:var(--grad);transform-origin:0 50%;transform:scaleX(0)}

  /* elemente comune */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips span{font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:#e6dcd2;backdrop-filter:blur(8px)}
  .chips span.free{background:rgba(242,106,33,.2);color:#ffa66b}
  .author{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  .author img{width:40px;height:40px;border-radius:50%}
  .author b{color:var(--cream);font-weight:600;display:block;font-size:14px}
  .body p{font-size:17px;line-height:1.75;color:#ddd3c9;margin:0 0 18px}
  .body p strong{color:var(--cream)}
  .body ul.dots{list-style:none;margin:0 0 20px}
  .body ul.dots li{position:relative;padding:6px 0 6px 26px;font-size:16px;line-height:1.6;color:#ddd3c9}
  .body ul.dots li::before{content:"";position:absolute;left:4px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--grad)}
  .prompt{position:relative;margin:26px 0 30px;border-radius:18px;background:#120d0b;border:1px solid rgba(242,106,33,.35)}
  .prompt .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#ff8a3d}
  .prompt button{font:600 12px Inter;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--grad);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
  .prompt pre{padding:16px 18px 18px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.65;white-space:pre-wrap;color:#f3e6d8}
  .prompt:has(.note){margin-bottom:52px}
  .prompt .note{position:absolute;right:14px;bottom:-30px;font-size:22px;transform:rotate(-4deg)}
  .mistake{position:relative;margin:34px 0 30px;padding:22px 22px 20px;background:var(--cream);color:#1b0f0a;transform:rotate(-.8deg);box-shadow:0 20px 40px rgba(0,0,0,.4)}
  .mistake .tape{position:absolute;top:-11px;left:24px;width:78px;height:22px;background:rgba(255,226,170,.9);transform:rotate(-4deg)}
  .mistake .k{font-family:Caveat;font-size:26px;color:#c2410c;line-height:1;margin-bottom:6px}
  .mistake p{color:#3d2f26!important;font-size:16px!important;margin:0!important}
  .shot{position:relative;margin:30px 0 34px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .shot .bar{display:flex;gap:6px;align-items:center;padding:10px 12px;background:#1d1613}
  .shot .bar i{width:10px;height:10px;border-radius:50%;background:#3a2c25}
  .shot .bar span{margin-left:10px;font-size:11px;color:var(--muted);background:#120d0b;padding:4px 10px;border-radius:6px;flex:1;max-width:260px}
  .shot .scr{aspect-ratio:16/9;background-size:cover;background-position:center;position:relative}
  .shot .scr::after{content:attr(data-c);position:absolute;left:14px;bottom:12px;font-size:12px;background:rgba(11,9,8,.8);padding:5px 10px;border-radius:8px;color:#e6dcd2}
  .shot .tp{position:absolute;top:-10px;right:30px;width:70px;height:22px;background:rgba(255,226,170,.85);transform:rotate(5deg);z-index:2}
  .shotwrap{position:relative}
  .need{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
  .need span{font-size:14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .need span::before{content:"✓ ";color:var(--orange);font-weight:700}

  /* final comun */
  .end{max-width:980px;margin:0 auto;padding:90px clamp(18px,5vw,40px) 120px}
  .end h2{font-family:Unbounded;font-weight:800;font-size:clamp(30px,5vw,56px);letter-spacing:-.04em;line-height:1.05;text-align:center}
  .end .sub{text-align:center;color:var(--muted);margin-top:12px;font-size:16px}
  .endgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:44px}
  .ecard{position:relative;border-radius:24px;padding:26px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);text-decoration:none;display:block;backdrop-filter:blur(8px)}
  .ecard h3{font-family:Unbounded;font-weight:600;font-size:19px;letter-spacing:-.02em;margin:14px 0 8px}
  .ecard p{color:#cfc4ba;font-size:14px;line-height:1.5}
  .ecard .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .ecard .btns a,.ecard button{font:600 13px Inter;padding:11px 16px;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
  .ecard .btns a{background:var(--cream);color:var(--ink)}
  .ecard .btns a.g{background:var(--grad);color:#fff}
  .ecard input{width:100%;margin-top:14px;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:var(--cream);font:15px Inter}
  .ecard button{margin-top:10px;width:100%;background:var(--grad);color:#fff}
  .ecard.next{padding:0;overflow:hidden}
  .ecard.next .im{height:130px;background-size:cover;background-position:center}
  .ecard.next .in{padding:20px 24px 24px}
  .ecard .ic{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}

  /* ===== V1 ARTICOL ===== */
  .a-cover{position:relative;isolation:isolate;min-height:88svh;display:flex;align-items:flex-end;padding:120px clamp(18px,6vw,90px) 56px;overflow:hidden}
  .a-cover .im{position:absolute;inset:-6% 0 0;background-size:cover;background-position:center;z-index:-2;transform:scale(1.05)}
  .a-cover::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,9,8,.35) 0%,rgba(11,9,8,.2) 30%,rgba(11,9,8,.85) 72%,var(--ink) 100%)}
  .a-cover .in{max-width:880px}
  .a-cover h1{font-family:Unbounded;font-weight:800;font-size:clamp(36px,6.4vw,84px);letter-spacing:-.045em;line-height:1;margin:18px 0 18px}
  .a-cover h1 .serif{font-size:1.12em;letter-spacing:-.01em}
  .a-cover .lead{font-size:clamp(17px,1.6vw,21px);line-height:1.5;color:#e6dcd2;max-width:640px;margin-bottom:26px}
  .a-cover .row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .a-wrap{display:grid;grid-template-columns:260px minmax(0,680px);gap:70px;justify-content:center;padding:40px clamp(18px,5vw,40px) 0}
  .a-toc{position:sticky;top:96px;align-self:start}
  .a-toc .eb{margin-bottom:16px}
  .a-toc a{display:flex;gap:12px;padding:9px 0;font-size:14px;color:var(--muted);text-decoration:none;border-left:2px solid rgba(255,255,255,.08);padding-left:14px;transition:color .2s,border-color .2s}
  .a-toc a b{font-family:Unbounded;font-size:11px;font-weight:600;color:#6b5a4d;min-width:18px;padding-top:2px}
  .a-toc a.on{color:var(--cream);border-color:var(--orange)}
  .a-toc a.on b{color:var(--orange)}
  .a-sec{padding-top:30px;scroll-margin-top:90px}
  .a-sec h2{font-family:Unbounded;font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;line-height:1.15;margin:30px 0 20px}
  .a-sec h2 small{display:block;font-family:Inter;font-weight:600;font-size:12px;letter-spacing:.25em;color:#ff8a3d;margin-bottom:12px}
  .pill{display:none}
  @media(max-width:900px){
    .a-wrap{grid-template-columns:1fr;gap:0}
    .a-toc{display:none}
    .pill{display:flex;position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:55;gap:10px;align-items:center;padding:11px 18px;border-radius:999px;background:rgba(20,15,12,.9);backdrop-filter:blur(14px);border:1px solid rgba(242,106,33,.45);font-size:13px;font-weight:600;cursor:pointer;color:var(--cream);white-space:nowrap}
  }
  .sheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
  .sheet .p{position:absolute;left:0;right:0;bottom:0;background:#15100d;border-radius:26px 26px 0 0;padding:22px 22px 34px;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);border-top:1px solid rgba(255,255,255,.1)}
  .sheet.on{opacity:1;pointer-events:auto}.sheet.on .p{transform:none}
  .sheet .p::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto 18px}
  .sheet a{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.07);text-decoration:none;font-size:15px}
  .sheet a b{font-family:Unbounded;font-size:12px;color:var(--orange);min-width:22px;padding-top:2px}

  /* ===== V2 CLIP ===== */
  .c-top{min-height:100svh;display:grid;grid-template-columns:minmax(0,340px) minmax(0,560px);gap:clamp(30px,6vw,90px);justify-content:center;align-items:center;padding:110px clamp(18px,5vw,40px) 60px}
  .phone{position:relative;aspect-ratio:9/16;border-radius:30px;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 8px #1d1613;transform:rotate(-3deg)}
  .phone::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.85))}
  .phone .cap{position:absolute;left:16px;right:16px;bottom:56px;z-index:2;font-weight:800;font-size:20px;line-height:1.2}
  .phone .cap em{font-style:italic;color:#ff8a3d}
  .phone .h{position:absolute;left:16px;bottom:22px;z-index:2;font-size:12px;color:#e6dcd2}
  .phone .play{position:absolute;left:50%;top:42%;z-index:2;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid rgba(255,255,255,.35)}
  .c-phonewrap{position:relative;width:100%}
  .c-phonewrap .hand{position:absolute;right:-30px;top:-34px;font-size:26px;transform:rotate(6deg);white-space:nowrap}
  .c-top h1{font-family:Unbounded;font-weight:800;font-size:clamp(30px,4.4vw,58px);letter-spacing:-.04em;line-height:1.05;margin:14px 0 16px}
  .c-top .lead{color:#d8cdc2;font-size:17px;line-height:1.55;margin-bottom:22px}
  .tldr{position:relative;border-radius:22px;padding:22px 22px 18px;background:rgba(242,106,33,.08);border:1px solid rgba(242,106,33,.35);margin:24px 0}
  .tldr .eb{margin-bottom:12px}
  .tldr ol{list-style:none;counter-reset:t}
  .tldr li{counter-increment:t;display:flex;gap:12px;padding:7px 0;font-size:15px;line-height:1.5;color:#efe5da}
  .tldr li::before{content:counter(t);flex:0 0 24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;font:700 12px Inter;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .c-btns{display:flex;gap:10px;flex-wrap:wrap}
  .c-btns a{padding:14px 22px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none}
  .c-btns a.p1{background:var(--grad);color:#fff}
  .c-btns a.p2{border:1px solid rgba(255,255,255,.25)}
  .c-body{max-width:720px;margin:0 auto;padding:30px clamp(18px,5vw,40px) 0}
  .c-step{display:grid;grid-template-columns:64px minmax(0,1fr);gap:18px;padding-top:40px;scroll-margin-top:80px}
  .c-step .n{font-family:Unbounded;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.05em;padding-top:4px}
  .c-step h2{font-family:Unbounded;font-weight:800;font-size:clamp(22px,2.6vw,30px);letter-spacing:-.03em;line-height:1.15;margin-bottom:18px}
  @media(max-width:820px){.c-top{grid-template-columns:1fr;padding-top:96px}.c-phonewrap{max-width:190px;margin:10px auto 0}.c-phonewrap .hand{right:auto;left:calc(100% + 6px);top:30%;font-size:22px;white-space:normal;width:110px}.c-step{grid-template-columns:1fr;gap:6px}.c-step .n{font-size:30px}}

  /* ===== V3 PAȘI ===== */
  .p-head{max-width:760px;margin:0 auto;padding:120px clamp(18px,5vw,40px) 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center}
  .p-head h1{font-family:Unbounded;font-weight:800;font-size:clamp(30px,4.6vw,54px);letter-spacing:-.04em;line-height:1.05;margin:14px 0}
  .p-head .lead{color:#d8cdc2;font-size:16px;line-height:1.55;margin-bottom:18px}
  .ring{position:relative;width:132px;height:132px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring .t b{font-family:Unbounded;font-size:30px;letter-spacing:-.04em}
  .ring .t span{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .p-list{max-width:760px;margin:0 auto;padding:10px clamp(18px,5vw,40px) 0;position:relative}
  .p-step{position:relative;margin-bottom:14px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);transition:border-color .3s,background .3s}
  .p-step.open{background:rgba(255,255,255,.055);border-color:rgba(242,106,33,.45)}
  .p-step.done{border-color:rgba(255,181,46,.25)}
  .p-step .hd{display:flex;align-items:center;gap:16px;padding:20px 22px;cursor:pointer}
  .p-step .ck{flex:0 0 38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:Unbounded;font-size:13px;font-weight:600;color:var(--muted);transition:all .3s}
  .p-step.done .ck{background:var(--grad);border-color:transparent;color:#fff;font-size:16px}
  .p-step .hd h2{font-family:Unbounded;font-weight:600;font-size:clamp(16px,2vw,20px);letter-spacing:-.02em;line-height:1.25;flex:1}
  .p-step.done .hd h2{color:var(--muted)}
  .p-step .hd i{font-style:normal;color:var(--muted);transition:transform .3s}
  .p-step.open .hd i{transform:rotate(180deg)}
  .p-step .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
  .p-step.open .bd{grid-template-rows:1fr}
  .p-step .bd>div{overflow:hidden}
  .p-step .bd .body{padding:0 22px 24px 76px}
  .doneb{display:inline-flex;gap:8px;align-items:center;margin-top:6px;padding:13px 20px;border-radius:999px;border:0;background:var(--grad);color:#fff;font:700 14px Inter;cursor:pointer}
  @media(max-width:640px){.p-head{grid-template-columns:1fr}.ring{width:104px;height:104px;order:-1}.p-step .bd .body{padding:0 18px 22px}}
  .yay{max-width:760px;margin:30px auto 0;padding:0 clamp(18px,5vw,40px);display:none;text-align:center}
  .yay.on{display:block}
  .yay div{padding:34px 20px;border-radius:24px;background:linear-gradient(135deg,rgba(255,181,46,.16),rgba(229,50,34,.16));border:1px solid rgba(242,106,33,.4)}
  .yay b{font-family:Unbounded;font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;display:block;margin-bottom:6px}

  /* bară de progres lipită sus (3a, 3b) */
  .sbar{position:fixed;top:70px;left:50%;z-index:58;display:flex;align-items:center;gap:12px;padding:9px 14px 9px 16px;border-radius:999px;background:rgba(20,15,12,.9);backdrop-filter:blur(14px);border:1px solid rgba(242,106,33,.4);font-size:13px;font-weight:600;transform:translate(-50%,-20px);opacity:0;pointer-events:none;transition:all .35s;white-space:nowrap}
  .sbar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .sbar .segs{display:flex;gap:4px}
  .sbar .segs i{width:22px;height:6px;border-radius:6px;background:rgba(255,255,255,.15);cursor:pointer;transition:background .3s}
  .sbar .segs i.d{background:var(--grad)}
  .sbar .segs i.c{box-shadow:0 0 0 2px rgba(242,106,33,.6)}
  .inprog{display:inline-flex;align-items:center;gap:10px;margin-top:20px;padding:10px 16px;border-radius:999px;background:rgba(11,9,8,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:600}
  .inprog .segs{display:flex;gap:4px}.inprog .segs i{width:18px;height:6px;border-radius:6px;background:rgba(255,255,255,.18)}.inprog .segs i.d{background:var(--grad)}

  /* 3c · linie */
  .l-list{position:relative;max-width:760px;margin:0 auto;padding:20px clamp(18px,5vw,40px) 0 clamp(70px,10vw,100px)}
  .l-line{position:absolute;left:calc(clamp(70px,10vw,100px) - 37px);top:40px;bottom:60px;width:3px;border-radius:3px;background:rgba(255,255,255,.1)}
  .l-line i{display:block;width:100%;height:0;border-radius:3px;background:linear-gradient(180deg,#ffb52e,#f26a21,#e53222);transition:height .7s cubic-bezier(.2,.8,.2,1)}
  .l-step{position:relative;padding:20px 0 40px;scroll-margin-top:90px}
  .l-dot{position:absolute;left:-58px;top:20px;width:44px;height:44px;border-radius:50%;background:#15100d;border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:Unbounded;font-weight:600;font-size:14px;color:var(--muted);transition:all .35s;z-index:2}

<script>
const QS=new URLSearchParams(location.search);
const V=QS.get('v')||'pasi-caiet',PDF=QS.get('pdf')||'instagram';

const U=(id,w=1600)=>`https://images.unsplash.com/photo-${id}?w=${w}&q=70`;

/* conținut de exemplu: aceleași texte în toate variantele, ca să compari doar forma */
const G={
  title:'Site-uri care se mișcă, <span class="serif gtxt">cu Claude</span>',

  tldr:['Fără indicații, Claude face mereu același site „sigur”.','Skill-urile de design îi dau gust: fonturi, culori, animații.','Ceri 3 direcții vizuale, alegi una, abia apoi scrie cod.'],

/* piese comune */
let pid=0;
function block(x){

const N_ST=G.steps.length;

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const nextOpen=after=>{for(let k=after+1;k<N_ST;k++)if(!done.includes(k))return k;for(let k=0;k<N_ST;k++)if(!done.includes(k))return k;return -1};
const RC=2*Math.PI*58;
const RING=`<div class="ring"><svg viewBox="0 0 132 132"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#ffb52e"/><stop offset=".5" stop-color="#f26a21"/><stop offset="1" stop-color="#e53222"/></linearGradient></defs><circle cx="66" cy="66" r="58" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/><circle id="rc" cx="66" cy="66" r="58" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${RC}" style="transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)"/></svg><div class="t"><b id="rn">0/${N_ST}</b><span>pași</span></div></div>`;
const YAY=`<div class="yay" id="yay"><div><b>Gata, ai terminat ghidul! 🎉</b><span style="color:#e6dcd2">Trimite-mi pe Instagram ce ai construit, îl pot arăta într-un clip.</span></div></div>`;
const SBAR=`<div class="sbar" id="sbar"><span id="sbt">0 din ${N_ST} pași</span><div class="segs">${G.steps.map((s,i)=>`<i data-go="${i}"></i>`).join('')}</div></div>`;
const INPROG=`<div class="inprog"><span id="ipt">0 din ${N_ST} pași bifați</span><div class="segs">${G.steps.map(()=>'<i></i>').join('')}</div></div>`;
// actualizează tot ce arată progresul (cerc, bară lipită, contor, mesaj final)
function paintProgress(cur){
  const n=done.length,$=id=>document.getElementById(id);
  if($('rn')){$('rn').textContent=n+'/'+N_ST;$('rc').style.strokeDashoffset=RC*(1-n/N_ST)}
  if($('sbt'))$('sbt').textContent=n===N_ST?'Ghid terminat ✓':`${n} din ${N_ST} pași`;
  document.querySelectorAll('.sbar .segs i').forEach((x,i)=>{x.classList.toggle('d',done.includes(i));x.classList.toggle('c',i===cur)});
  if($('ipt'))$('ipt').textContent=`${n} din ${N_ST} pași bifați`;
  document.querySelectorAll('.inprog .segs i').forEach((x,i)=>x.classList.toggle('d',done.includes(i)));
  if($('kn'))$('kn').textContent=n;
  if($('yay'))$('yay').classList.toggle('on',n===N_ST);
  save();
}

function wireSbar(stepSel){
  const sb=document.getElementById('sbar');if(!sb)return;
  addEventListener('scroll',()=>sb.classList.toggle('on',scrollY>innerHeight*.7),{passive:true});
  sb.querySelectorAll('i').forEach(x=>x.onclick=()=>document.querySelectorAll(stepSel)[+x.dataset.go].scrollIntoView({behavior:'smooth',block:'start'}));

function wireAcc(){
  const steps=[...document.querySelectorAll('.p-step')];let cur=-1;
  const paint=()=>{steps.forEach((el,i)=>{const d=done.includes(i);el.classList.toggle('done',d);el.querySelector('.ck').textContent=d?'✓':i+1;el.querySelector('.doneb').textContent=d?'Marchează ca nefăcut':'Am făcut pasul ✓'});paintProgress(cur)};
  const open=i=>{cur=i;steps.forEach((el,k)=>el.classList.toggle('open',k===i));paint()};
  steps.forEach((el,i)=>{el.querySelector('.hd').onclick=()=>open(el.classList.contains('open')?-1:i);
    el.querySelector('.doneb').onclick=()=>{if(done.includes(i)){done=done.filter(x=>x!==i);paint();return}
      done.push(i);const nx=nextOpen(i);open(nx);
      if(nx>=0)setTimeout(()=>steps[nx].scrollIntoView({behavior:'smooth',block:'start'}),350)}});
  open(nextOpen(-1));wireSbar('.p-step');
}

  const paint=()=>{sheets.forEach((el,i)=>{const d=done.includes(i);el.classList.toggle('done',d);el.querySelector('.doneb').textContent=d?'Bifat ✓ · anulează':'Am făcut pasul ✓'});paintProgress(-1)};
  sheets.forEach((el,i)=>{const tog=()=>{
    if(done.includes(i))done=done.filter(x=>x!==i);else{done.push(i);const nx=nextOpen(i);if(nx>i)setTimeout(()=>sheets[nx].scrollIntoView({behavior:'smooth',block:'start'}),650)}
    paint()};el.querySelector('.k-box').onclick=tog;el.querySelector('.doneb').onclick=tog});
  paint();wireSbar('.k-sheet');
}

/* ===== 4 · STORY ===== */
if(V==='story'){
  const N=G.steps.length+2;
  main.innerHTML=`<div class="s-stage"><div class="s-box">
    <div class="s-bars">${Array.from({length:N},()=>'<i></i>').join('')}</div>
    <div class="s-track" id="trk">
      <div class="s-card cover" style="background-image:url('${U(G.img,900)}')"><span class="lbl" style="align-self:flex-start">varianta 4 · ca un story</span><div style="height:12px"></div>${chips}<h1>${G.title}</h1><p style="color:#e6dcd2;font-size:15px;line-height:1.5;margin-bottom:16px">${G.lead}</p>${author}<p class="hand" style="font-size:24px;margin-top:20px">dă cu degetul →</p></div>
      ${G.steps.map((s,i)=>`<div class="s-card"><div class="n gtxt">${String(i+1).padStart(2,'0')}</div><h2>${s.t}</h2>${body(s)}</div>`).join('')}
      <div class="s-card" style="display:flex;flex-direction:column;justify-content:center"><div class="n gtxt">✓</div><h2>Gata! Ți-a fost util?</h2><div class="body"><p>Urmărește-mă pentru clipul următor sau primește ghidul nou pe e-mail.</p></div>
        <div class="c-btns"><a class="p1" href="#">TikTok</a><a class="p2" href="#">Instagram</a></div>
        <input placeholder="adresa ta de e-mail" style="margin-top:22px;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3);color:var(--cream);font:15px Inter"><button style="margin-top:10px;padding:14px;border-radius:999px;border:0;background:var(--grad);color:#fff;font:700 14px Inter">Vreau ghidurile</button></div>
    </div>
    <div class="s-nav"><button id="sp">←</button><span id="sc">1 / ${N}</span><button id="sn">→</button></div>
    <div class="s-hint hand">pe telefon ocupă tot ecranul</div>
  </div></div>`;
  const trk=document.getElementById('trk'),bars=[...document.querySelectorAll('.s-bars i')];
  const cur=()=>Math.round(trk.scrollLeft/trk.clientWidth);
  // „at” ține cardul-țintă, ca apăsările rapide pe săgeți să nu se piardă în timpul animației
  let at=0;
  const go=i=>{at=Math.max(0,Math.min(N-1,i));trk.scrollTo({left:at*trk.clientWidth,behavior:'smooth'})};
  trk.addEventListener('scrollend',()=>{at=cur()});
  document.getElementById('sp').onclick=()=>go(at-1);document.getElementById('sn').onclick=()=>go(at+1);
  addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(at+1);if(e.key==='ArrowLeft')go(at-1)});
  const upd=()=>{const c=cur();bars.forEach((b,i)=>b.style.setProperty('--f',i<=c?1:0));document.getElementById('sc').textContent=(c+1)+' / '+N};
  trk.addEventListener('scroll',upd,{passive:true});upd();
  document.getElementById('nav').style.display=innerWidth<700?'none':'';
}

/* bară de progres a citirii + nav opac după cover */
addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById('prog').style.transform=`scaleX(${h>0?scrollY/h:0})`;
  document.getElementById('nav').classList.toggle('solid',scrollY>innerHeight*.5)},{passive:true});
</script>
</body>
