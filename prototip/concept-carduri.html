<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofoliu: cardurile</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--grad:linear-gradient(90deg,#ffb52e,#f26a21 45%,#e53222)}
*{box-sizing:border-box;margin:0}
body{background:#0b0908;color:#f6efe3;font:400 15px/1.5 Inter,system-ui,sans-serif;padding:34px 16px 60px}
.pa{display:grid;grid-template-columns:repeat(3,minmax(0,330px));gap:30px;justify-content:center}
@media (max-width:760px){.pa{grid-template-columns:minmax(0,360px)}}
.it{position:relative;display:block;background:#f6efe3;color:#1b0f0a;padding:12px 12px 18px;box-shadow:0 30px 60px rgba(0,0,0,.55);text-decoration:none;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.it:nth-child(odd){transform:rotate(-1.6deg)}
.it:nth-child(even){transform:rotate(1.4deg) translateY(18px)}
.it:hover{transform:rotate(0) translateY(-10px)}
.tp{position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(255,226,170,.85);transform:rotate(-3deg);z-index:1}
.im{position:relative;height:200px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover}
.ctag{position:absolute;left:10px;top:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--grad);color:#fff}
h3{margin-top:12px;font:600 16px/1.25 Unbounded,sans-serif}
p{margin-top:6px;color:#4d3b30}
</style>
</head>
<body>
<div class="pa">
  <a class="it" href="concept-clinica.html"><span class="tp"></span>
    <div class="im"><img src="concept-clinica/cabinet.jpg" alt=""><span class="ctag">Concept</span></div>
    <h3>Clinică stomatologică</h3><p>Prima vizită explicată pas cu pas, tarife și programare.</p></a>
  <a class="it" href="concept-frizerie-c.html"><span class="tp"></span>
    <div class="im"><img src="concept-frizerie/hol.jpg" alt="" style="object-position:50% 62%"><span class="ctag">Concept</span></div>
    <h3>Frizerie</h3><p>Prețuri la vedere și programare direct din pagină.</p></a>
  <a class="it" href="concept-tatuaje.html"><span class="tp"></span>
    <div class="im"><img src="concept-tatuaje/maini.jpg" alt="" style="object-position:50% 38%"><span class="ctag">Concept</span></div>
    <h3>Salon de tatuaje</h3><p>Lucrările expuse ca tablouri, iar ideea se trimite din site.</p></a>
</div>
</body>
</html>
